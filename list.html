<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品列表</title>
<style>
  :root {
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --bg: #f8fafc;
    --card: #ffffff;
    --accent-soft: #f1f5f9;
    --radius: 16px;
    --shadow-sm: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
    --shadow-md: 0 4px 12px rgba(15,23,42,.06), 0 2px 4px rgba(15,23,42,.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Inter", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  header { position: sticky; top: 0; z-index: 50; background: rgba(248,250,252,.8); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
  .header-in { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .back { font-size: 14px; color: var(--ink); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; transition: background .15s; }
  .back:hover { background: var(--accent-soft); }
  .lang-btn { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; }
  .lang-btn:hover { background: var(--accent-soft); }

  .page-head { padding: 48px 0 8px; }
  .page-head h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -.04em; line-height: 1.1; }
  .page-head .desc { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 8px; }
  .chip { border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; }
  .chip:hover { border-color: #cbd5e1; color: var(--ink); }
  .chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .count { color: var(--muted); font-size: 13px; margin: 12px 0 24px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; padding-bottom: 56px; }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
  .card { background: var(--card); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow-sm); cursor: pointer; display: flex; flex-direction: column; transition: all .18s; }
  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: #cbd5e1; }
  .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #f1f5f9; }
  .card .body { padding: 14px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .card .name { font-size: 14px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; letter-spacing: -.01em; }
  .card .price { color: var(--ink); font-weight: 700; font-size: 18px; letter-spacing: -.02em; }
  .card .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .card .state { background: var(--accent-soft); color: var(--ink); border-radius: 6px; padding: 1px 7px; font-weight: 600; font-size: 11px; }
  .empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 80px 0; }

  .float-contact { position: fixed; right: 20px; bottom: 20px; z-index: 90; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .float-contact .items { display: none; flex-direction: column; gap: 10px; }
  .float-contact.open .items { display: flex; }
  .float-contact a, .float-contact button { display: flex; align-items: center; gap: 8px; border: none; cursor: pointer; background: #fff; border-radius: 12px; padding: 11px 16px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 16px rgba(15,23,42,.12); color: var(--ink); border: 1px solid var(--line); }
  .float-contact .wx { background: #07c160; color: #fff; border-color: #07c160; }
  .float-contact .tel { background: var(--ink); color: #fff; border-color: var(--ink); }
  .float-contact .toggle { width: 52px; height: 52px; justify-content: center; padding: 0; border-radius: 50%; background: var(--ink); color: #fff; font-size: 22px; box-shadow: 0 8px 24px rgba(15,23,42,.3); border: none; }
</style>
</head>
<body>

<header>
  <div class="wrap header-in">
    <a class="back" href="index.html" id="backBtn">← 返回首页</a>
    <button class="lang-btn" id="langBtn">EN</button>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <h1 id="pageTitle">产品列表</h1>
    <p class="desc" id="pageDesc"></p>
    <div class="filters" id="filters"></div>
    <div class="count" id="count"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="float-contact" id="floatContact">
  <div class="items">
    <a class="wx" href="weixin://">💬 <span id="fcWechat">微信：2222222222</span></a>
    <a class="tel" href="tel:3333333333">📞 <span id="fcPhone">电话：3333333333</span></a>
  </div>
  <button class="toggle" id="fcToggle">💬</button>
</div>

<script src="data.js"></script>
<script>
const cat = getParam("cat") || "all";
const products = getProducts();
renderLangBtn(document.getElementById("langBtn"));

const CATS = ["all","usa","fba","canada","germany","uk","other"];
let active = "all";

function applyLang() {
  const L = I18N[getLang()];
  document.getElementById("backBtn").textContent = "← " + L.back;
  document.getElementById("fcWechat").textContent = L.wechat;
  document.getElementById("fcPhone").textContent = L.phone;
  document.getElementById("pageTitle").textContent = cat === "all" ? L.navProducts : categoryLabel(cat);
  document.getElementById("pageDesc").textContent = getLang()==='zh' ? "现货库存，支持筛选与查看详情" : "In-stock items, filter and view details";
  document.title = document.getElementById("pageTitle").textContent;
  renderFilters();
  render();
}

function renderFilters() {
  const L = I18N[getLang()];
  const el = document.getElementById("filters");
  el.innerHTML = CATS.map(c =>
    `<button class="chip ${active===c?'active':''}" data-c="${c}">${c==='all'?L.all:categoryLabel(c)}</button>`
  ).join("");
  el.querySelectorAll(".chip").forEach(b => b.onclick = () => { active = b.dataset.c; renderFilters(); render(); });
}

function render() {
  const L = I18N[getLang()];
  let list = products;
  if (cat !== "all") list = list.filter(p => p.category === cat);
  if (active !== "all") list = list.filter(p => p.category === active);
  document.getElementById("count").textContent = list.length + " " + (getLang()==='zh'?'件商品':'products');

  if (!list.length) {
    document.getElementById("grid").innerHTML = `<div class="empty">${L.noProducts}</div>`;
    return;
  }
  document.getElementById("grid").innerHTML = list.map(p => `
    <div class="card" onclick="location.href='detail.html?id=${p.id}'">
      <img src="${p.images[0]}" alt="${getLang()==='zh'?p.name:p.nameEn}" loading="lazy">
      <div class="body">
        <div class="name">${getLang()==='zh'?p.name:p.nameEn}</div>
        <div class="price">${formatPrice(p.price)}</div>
        <div class="meta">
          ${p.state ? `<span class="state">${p.state}</span>` : ""}
          <span>${L.quantity}：${p.quantity}</span>
        </div>
      </div>
    </div>`).join("");
}

if (CATS.includes(cat)) active = cat;
applyLang();

const fc = document.getElementById("floatContact");
document.getElementById("fcToggle").onclick = () => fc.classList.toggle("open");
</script>
</body>
</html>
