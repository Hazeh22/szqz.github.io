<!DOCTYPE html>
<html lang="zh-CN">

  :root { --brand:#ff5a1f; --brand2:#ffb020; --ink:#111827; --muted:#6b7280; --bg:#fbfaf8; --shadow:0 6px 24px rgba(17,24,39,.06); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  a { text-decoration: none; color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

  .header-in { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .back { font-size: 14px; color: var(--brand); font-weight: 700; }
  .lang-btn { border: 1px solid #f0e2d8; background:#fff; color: var(--brand); padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }

  .page-head { padding: 34px 0 10px; }
  .page-head h1 { font-size: clamp(26px, 4vw, 38px); font-weight: 900; letter-spacing: -.5px; }
  .filters { display: flex; flex-wrap: wrap; gap: 9px; margin: 20px 0 8px; }
  .chip { border: 1px solid #f0e2d8; background: #fff; color: #6b4a3a; border-radius: 999px; padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .chip:hover { border-color: #ffd2bd; color: var(--brand); }
  .chip.active { background: linear-gradient(135deg,#ff5a1f,#ffb020); border-color: transparent; color: #fff; box-shadow: 0 6px 16px rgba(255,90,31,.25); }
  .count { color: var(--muted); font-size: 13px; margin: 12px 0 20px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; padding-bottom: 50px; }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
  .card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid #f2ece5; cursor: pointer; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(17,24,39,.1); }
  .card img { width: 100%; height: 170px; object-fit: cover; display: block; background: #f3f4f6; }
  @media (max-width: 560px) { .card img { height: 130px; } }
  .card .body { padding: 14px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .card .name { font-size: 14px; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .price { color: var(--brand); font-weight: 800; font-size: 18px; }
  .card .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .card .state { background: #fff1ea; color: #b8430f; border-radius: 6px; padding: 1px 7px; font-weight: 700; font-size: 11px; }
  .empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 60px 0; }
