<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨境现货清仓</title>
<style>
  :root {
    --brand: #ff5a1f; --brand2: #ffb020; --ink: #111827; --muted: #6b7280;
    --bg: #fbfaf8; --card: #ffffff; --radius: 20px; --shadow: 0 6px 24px rgba(17,24,39,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
  a { text-decoration: none; color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

  header { position: sticky; top: 0; z-index: 50; background: rgba(251,250,248,.85); backdrop-filter: blur(12px); border-bottom: 1px solid #f0ece6; }
  .header-in { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .logo { font-weight: 800; font-size: 19px; background: linear-gradient(90deg,#ff5a1f,#ffb020); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lang-btn { border: 1px solid #f0e2d8; background: #fff; color: var(--brand); padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .lang-btn:hover { background: #fff3ea; border-color: #ffd2bd; }

  /* Hero */
  .hero { padding: 56px 0 40px; text-align: center; }
  .hero h1 { font-size: clamp(34px, 6vw, 56px); font-weight: 900; letter-spacing: -1px; line-height: 1.15; background: linear-gradient(100deg,#ff5a1f 0%,#ff8a3d 45%,#ffb020 100%); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 18px; }
  .hero p { color: #4b5563; font-size: clamp(15px, 2.2vw, 18px); max-width: 820px; margin: 0 auto; word-break: break-all; line-height: 1.8; }

  .section-title { font-size: clamp(20px, 3vw, 26px); font-weight: 800; margin: 44px 0 20px; display: flex; align-items: center; gap: 10px; }
  .section-title::before { content: ""; width: 6px; height: 26px; border-radius: 3px; background: linear-gradient(180deg,#ff5a1f,#ffb020); }

  /* 大按钮 */
  .big-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  @media (max-width: 640px) { .big-grid { grid-template-columns: 1fr; } }
  .big-btn { display: flex; align-items: center; gap: 18px; border-radius: var(--radius); padding: 28px 26px; color: #fff; box-shadow: 0 12px 30px rgba(255,90,31,.18); transition: transform .18s, box-shadow .18s; }
  .big-btn:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(255,90,31,.26); }
  .big-usa { background: linear-gradient(135deg,#ff5a1f 0%,#ff8a3d 100%); }
  .big-fba { background: linear-gradient(135deg,#2563eb 0%,#4f8cff 100%); }
  .big-btn .icon { font-size: 38px; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.18); border-radius: 16px; flex-shrink: 0; }
  .big-btn .text { display: flex; flex-direction: column; gap: 4px; }
  .big-btn .title { font-size: clamp(19px, 2.6vw, 24px); font-weight: 800; }
  .big-btn .sub { font-size: 13px; opacity: .9; }

  /* 小按钮 */
  .small-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 760px) { .small-grid { grid-template-columns: repeat(2, 1fr); } }
  .small-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: #fff; border: 1px solid #f0e6dc; border-radius: 16px; padding: 22px 12px; font-weight: 700; font-size: 15px; color: var(--ink); box-shadow: var(--shadow); transition: all .18s; }
  .small-btn:hover { border-color: #ffd2bd; color: var(--brand); transform: translateY(-3px); box-shadow: 0 10px 24px rgba(255,90,31,.12); }
  .small-btn .flag { font-size: 28px; }

  /* 轮播 */
  .carousel { position: relative; overflow: hidden; border-radius: var(--radius); background: #fff; box-shadow: var(--shadow); }
  .track { display: flex; transition: transform .5s ease; }
  .slide { min-width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 16px; }
  @media (max-width: 560px) { .slide { grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; } }
  .p-card { border-radius: 14px; overflow: hidden; background: #fff; border: 1px solid #f2ece5; cursor: pointer; transition: transform .15s; }
  .p-card:hover { transform: translateY(-2px); }
  .p-card img { width: 100%; height: 130px; object-fit: cover; display: block; background: #f3f4f6; }
  @media (max-width: 560px) { .p-card img { height: 100px; } }
  .p-card .body { padding: 10px 12px; }
  .p-card .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-card .price { color: var(--brand); font-weight: 800; font-size: 14px; margin-top: 2px; }
  .dots { display: flex; justify-content: center; gap: 7px; padding: 12px 0 16px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #f0d9cb; cursor: pointer; transition: all .2s; }
  .dot.active { background: var(--brand); width: 22px; border-radius: 4px; }

  /* 首页底部产品 */
  .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  @media (max-width: 560px) { .home-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
  .h-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid #f2ece5; cursor: pointer; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
  .h-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(17,24,39,.1); }
  .h-card img { width: 100%; height: 170px; object-fit: cover; display: block; background: #f3f4f6; }
  @media (max-width: 560px) { .h-card img { height: 130px; } }
  .h-card .body { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .h-card .name { font-size: 14px; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .h-card .price { color: var(--brand); font-weight: 800; font-size: 17px; }
  .h-card .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .h-card .state { background: #fff1ea; color: #b8430f; border-radius: 6px; padding: 1px 7px; font-weight: 700; font-size: 11px; }

  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 50px 0 90px; }

  .float-contact { position: fixed; right: 18px; bottom: 20px; z-index: 90; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .float-contact .items { display: none; flex-direction: column; gap: 10px; }
  .float-contact.open .items { display: flex; }
  .float-contact a, .float-contact button { display: flex; align-items: center; gap: 8px; border: none; cursor: pointer; background: #fff; border-radius: 999px; padding: 11px 16px; font-size: 13px; font-weight: 700; box-shadow: 0 8px 24px rgba(17,24,39,.16); color: var(--ink); }
  .float-contact .wx { background: #07c160; color: #fff; }
  .float-contact .tel { background: var(--brand); color: #fff; }
  .float-contact .toggle { width: 52px; height: 52px; justify-content: center; padding: 0; border-radius: 50%; background: linear-gradient(135deg,#ff5a1f,#ffb020); color: #fff; font-size: 22px; box-shadow: 0 10px 26px rgba(255,90,31,.35); }
</style>
</head>
<body>

<header>
  <div class="wrap header-in">
    <a class="logo" href="index.html" id="siteName">跨境现货清仓</a>
    <button class="lang-btn" id="langBtn">EN</button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1 id="heroTitle">跨境现货清仓</h1>
    <p id="heroDesc">1111111111111111111111111111111111111111111111111</p>
  </section>

  <h2 class="section-title" id="bigTitle">商品分类</h2>
  <div class="big-grid" style="margin-bottom:18px;">
    <a class="big-btn big-usa" href="list.html?cat=usa">
      <div class="icon">🇺🇸</div>
      <div class="text">
        <div class="title" id="btnUsa">美国海外仓现货</div>
        <div class="sub" id="btnUsaSub">US Overseas Warehouse</div>
      </div>
    </a>
    <a class="big-btn big-fba" href="list.html?cat=fba">
      <div class="icon">📦</div>
      <div class="text">
        <div class="title" id="btnFba">FBA包邮移除现货</div>
        <div class="sub" id="btnFbaSub">FBA Removal Stock</div>
      </div>
    </a>
  </div>

  <div class="small-grid">
    <a class="small-btn" href="list.html?cat=canada"><span class="flag">🇨🇦</span><span id="btnCa">加拿大</span></a>
    <a class="small-btn" href="list.html?cat=germany"><span class="flag">🇩🇪</span><span id="btnDe">德国</span></a>
    <a class="small-btn" href="list.html?cat=uk"><span class="flag">🇬🇧</span><span id="btnUk">英国</span></a>
    <a class="small-btn" href="list.html?cat=other"><span class="flag">🌍</span><span id="btnOther">其他国家</span></a>
  </div>

  <h2 class="section-title" id="featuredTitle">新上架推荐</h2>
  <div class="carousel">
    <div class="track" id="track"></div>
    <div class="dots" id="dots"></div>
  </div>

  <h2 class="section-title" id="allTitle">全部产品</h2>
  <div class="home-grid" id="homeGrid"></div>

  <footer id="footer">跨境现货清仓 · 咨询微信 2222222222 · 电话 3333333333</footer>
</main>

<div class="float-contact" id="floatContact">
  <div class="items">
    <a class="wx" href="weixin://">💬 <span id="fcWechat">微信：2222222222</span></a>
    <a class="tel" href="tel:3333333333">📞 <span id="fcPhone">电话：3333333333</span></a>
  </div>
  <button class="toggle" id="fcToggle">💬</button>
</div>

<script src="data.js"></script>
<script>
const products = getProducts();
renderLangBtn(document.getElementById("langBtn"));

function applyLang() {
  const L = I18N[getLang()];
  document.getElementById("siteName").textContent = L.siteName;
  document.getElementById("heroTitle").textContent = L.siteName;
  document.getElementById("heroDesc").textContent = L.siteDesc;
  document.getElementById("bigTitle").textContent = L.categories;
  document.getElementById("featuredTitle").textContent = L.featured;
  document.getElementById("allTitle").textContent = L.allProducts;
  document.getElementById("btnUsa").textContent = L.usa;
  document.getElementById("btnUsaSub").textContent = getLang()==='zh'?"US Overseas Warehouse":"美国海外仓现货";
  document.getElementById("btnFba").textContent = L.fba;
  document.getElementById("btnFbaSub").textContent = getLang()==='zh'?"FBA Removal Stock":"FBA包邮移除现货";
  document.getElementById("btnCa").textContent = L.canada;
  document.getElementById("btnDe").textContent = L.germany;
  document.getElementById("btnUk").textContent = L.uk;
  document.getElementById("btnOther").textContent = L.other;
  document.getElementById("fcWechat").textContent = L.wechat;
  document.getElementById("fcPhone").textContent = L.phone;
  document.getElementById("footer").textContent = L.siteName + " · " + L.wechat + " · " + L.phone;
  document.title = L.siteName;
}
applyLang();

// 轮播
const latest = products.slice(-10).reverse();
const pages = [];
for (let i = 0; i < latest.length; i += 4) pages.push(latest.slice(i, i + 4));
while (pages.length < 5) pages.push([]);
const track = document.getElementById("track");
const dotsEl = document.getElementById("dots");
let cur = 0;

function renderSlides() {
  track.innerHTML = pages.map(page => `
    <div class="slide">
      ${page.map(p => `
        <div class="p-card" onclick="location.href='detail.html?id=${p.id}'">
          <img src="${p.images[0]}" alt="${getLang()==='zh'?p.name:p.nameEn}">
          <div class="body">
            <div class="name">${getLang()==='zh'?p.name:p.nameEn}</div>
            <div class="price">${formatPrice(p.price)}</div>
          </div>
        </div>`).join("")}
    </div>`).join("");
  dotsEl.innerHTML = pages.map((_, i) => `<span class="dot ${i===cur?'active':''}" data-i="${i}"></span>`).join("");
  dotsEl.querySelectorAll(".dot").forEach(d => d.onclick = () => go(+d.dataset.i));
  go(cur);
}
function go(i) {
  cur = Math.max(0, Math.min(i, pages.length - 1));
  track.style.transform = `translateX(-${cur * 100}%)`;
  dotsEl.querySelectorAll(".dot").forEach((d, idx) => d.classList.toggle("active", idx === cur));
}
renderSlides();
setInterval(() => go((cur + 1) % pages.length), 4500);

// 首页底部全部产品
function renderHomeGrid() {
  document.getElementById("homeGrid").innerHTML = products.map(p => `
    <div class="h-card" onclick="location.href='detail.html?id=${p.id}'">
      <img src="${p.images[0]}" alt="${getLang()==='zh'?p.name:p.nameEn}" loading="lazy">
      <div class="body">
        <div class="name">${getLang()==='zh'?p.name:p.nameEn}</div>
        <div class="price">${formatPrice(p.price)}</div>
        <div class="meta">
          ${p.state ? `<span class="state">${p.state}</span>` : ""}
          <span>${t("quantity")}：${p.quantity}</span>
        </div>
      </div>
    </div>`).join("");
}
renderHomeGrid();

const fc = document.getElementById("floatContact");
document.getElementById("fcToggle").onclick = () => fc.classList.toggle("open");
</script>
</body>
</html>
