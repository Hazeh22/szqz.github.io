<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨境现货清仓</title>
<style>
  :root {
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --bg: #f8fafc;
    --card: #ffffff;
    --accent: #0f172a;
    --accent-soft: #f1f5f9;
    --radius: 16px;
    --shadow-sm: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
    --shadow-md: 0 4px 12px rgba(15,23,42,.06), 0 2px 4px rgba(15,23,42,.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Inter", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  header { position: sticky; top: 0; z-index: 50; background: rgba(248,250,252,.8); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
  .header-in { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .logo { font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
  .lang-btn { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; }
  .lang-btn:hover { background: var(--accent-soft); }

  /* Hero */
  .hero { padding: 72px 0 56px; text-align: center; }
  .hero h1 { font-size: clamp(36px, 6vw, 60px); font-weight: 800; letter-spacing: -.04em; line-height: 1.1; margin-bottom: 20px; }
  .hero p { color: var(--muted); font-size: clamp(15px, 2vw, 17px); max-width: 720px; margin: 0 auto; word-break: break-all; line-height: 1.8; }

  .section-title { font-size: clamp(18px, 2.5vw, 22px); font-weight: 700; letter-spacing: -.02em; margin: 56px 0 20px; }
  .section-title .sub { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 4px; letter-spacing: 0; }

  /* 大按钮 */
  .big-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 640px) { .big-grid { grid-template-columns: 1fr; } }
  .big-btn { display: flex; align-items: center; gap: 18px; border-radius: var(--radius); padding: 28px 26px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-sm); transition: all .2s ease; }
  .big-btn:hover { border-color: #cbd5e1; box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .big-btn .icon { font-size: 32px; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: var(--accent-soft); border-radius: 14px; flex-shrink: 0; }
  .big-btn .text { display: flex; flex-direction: column; gap: 2px; }
  .big-btn .title { font-size: clamp(17px, 2.2vw, 20px); font-weight: 700; letter-spacing: -.02em; }
  .big-btn .sub { font-size: 13px; color: var(--muted); }
  .big-btn .arrow { margin-left: auto; color: #94a3b8; font-size: 18px; transition: transform .2s; }
  .big-btn:hover .arrow { transform: translateX(3px); color: var(--ink); }

  /* 小按钮 */
  .small-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 760px) { .small-grid { grid-template-columns: repeat(2, 1fr); } }
  .small-btn { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow-sm); transition: all .18s; }
  .small-btn:hover { border-color: #cbd5e1; box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .small-btn .flag { font-size: 22px; }

  /* 轮播 */
  .carousel { position: relative; overflow: hidden; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
  .track { display: flex; transition: transform .5s cubic-bezier(.4,0,.2,1); }
  .slide { min-width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
  @media (max-width: 900px) { .slide { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .slide { grid-template-columns: repeat(2, 1fr); } }
  .p-card { padding: 16px; cursor: pointer; border-right: 1px solid var(--line); transition: background .15s; }
  .p-card:last-child { border-right: none; }
  .p-card:hover { background: #fafbfc; }
  .p-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; background: #f1f5f9; display: block; margin-bottom: 10px; }
  .p-card .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
  .p-card .price { color: var(--ink); font-weight: 700; font-size: 15px; margin-top: 2px; }
  .dots { display: flex; justify-content: center; gap: 6px; padding: 16px 0 20px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #cbd5e1; cursor: pointer; transition: all .2s; }
  .dot.active { background: var(--ink); width: 20px; border-radius: 3px; }

  /* 首页产品网格 */
  .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  @media (max-width: 560px) { .home-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
  .h-card { background: var(--card); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow-sm); cursor: pointer; display: flex; flex-direction: column; transition: all .18s; }
  .h-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: #cbd5e1; }
  .h-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #f1f5f9; }
  .h-card .body { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .h-card .name { font-size: 14px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; letter-spacing: -.01em; }
  .h-card .price { color: var(--ink); font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
  .h-card .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .h-card .state { background: var(--accent-soft); color: var(--ink); border-radius: 6px; padding: 1px 7px; font-weight: 600; font-size: 11px; }

  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 56px 0 96px; border-top: 1px solid var(--line); margin-top: 56px; }

  .float-contact { position: fixed; right: 20px; bottom: 20px; z-index: 90; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .float-contact .items { display: none; flex-direction: column; gap: 10px; }
  .float-contact.open .items { display: flex; }
  .float-contact a, .float-contact button { display: flex; align-items: center; gap: 8px; border: none; cursor: pointer; background: #fff; border-radius: 12px; padding: 11px 16px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 16px rgba(15,23,42,.12); color: var(--ink); border: 1px solid var(--line); }
  .float-contact .wx { background: #07c160; color: #fff; border-color: #07c160; }
  .float-contact .tel { background: var(--ink); color: #fff; border-color: var(--ink); }
  .float-contact .toggle { width: 52px; height: 52px; justify-content: center; padding: 0; border-radius: 50%; background: var(--ink); color: #fff; font-size: 22px; box-shadow: 0 8px 24px rgba(15,23,42,.3); border: none; }
</style>
</head>
<body>

<header>
  <div class="wrap header-in">
    <a class="logo" href="index.html" id="siteName">跨境现货清仓</a>
    <button class="lang-btn" id="langBtn">EN</button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1 id="heroTitle">跨境现货清仓</h1>
    <p id="heroDesc">1111111111111111111111111111111111111111111111111</p>
  </section>

  <h2 class="section-title" id="bigTitle">商品分类<span class="sub" id="bigSub">按仓库和地区浏览现货</span></h2>
  <div class="big-grid" style="margin-bottom:16px;">
    <a class="big-btn" href="list.html?cat=usa">
      <div class="icon">🇺🇸</div>
      <div class="text">
        <div class="title" id="btnUsa">美国海外仓现货</div>
        <div class="sub" id="btnUsaSub">US Overseas Warehouse</div>
      </div>
      <div class="arrow">→</div>
    </a>
    <a class="big-btn" href="list.html?cat=fba">
      <div class="icon">📦</div>
      <div class="text">
        <div class="title" id="btnFba">FBA包邮移除现货</div>
        <div class="sub" id="btnFbaSub">FBA Removal Stock</div>
      </div>
      <div class="arrow">→</div>
    </a>
  </div>

  <div class="small-grid">
    <a class="small-btn" href="list.html?cat=canada"><span class="flag">🇨🇦</span><span id="btnCa">加拿大</span></a>
    <a class="small-btn" href="list.html?cat=germany"><span class="flag">🇩🇪</span><span id="btnDe">德国</span></a>
    <a class="small-btn" href="list.html?cat=uk"><span class="flag">🇬🇧</span><span id="btnUk">英国</span></a>
    <a class="small-btn" href="list.html?cat=other"><span class="flag">🌍</span><span id="btnOther">其他国家</span></a>
  </div>

  <h2 class="section-title" id="featuredTitle">新上架推荐<span class="sub" id="featuredSub">最近上架的现货</span></h2>
  <div class="carousel">
    <div class="track" id="track"></div>
    <div class="dots" id="dots"></div>
  </div>

  <h2 class="section-title" id="allTitle">全部产品<span class="sub" id="allSub">共 <span id="totalCount">0</span> 件现货</span></h2>
  <div class="home-grid" id="homeGrid"></div>

  <footer id="footer">跨境现货清仓 · 咨询微信 2222222222 · 电话 3333333333</footer>
</main>

<div class="float-contact" id="floatContact">
  <div class="items">
    <a class="wx" href="weixin://">💬 <span id="fcWechat">微信：2222222222</span></a>
    <a class="tel" href="tel:3333333333">📞 <span id="fcPhone">电话：3333333333</span></a>
  </div>
  <button class="toggle" id="fcToggle">💬</button>
</div>

<script src="data.js"></script>
<script>
const products = getProducts();
renderLangBtn(document.getElementById("langBtn"));

function applyLang() {
  const L = I18N[getLang()];
  document.getElementById("siteName").textContent = L.siteName;
  document.getElementById("heroTitle").textContent = L.siteName;
  document.getElementById("heroDesc").textContent = L.siteDesc;
  document.getElementById("bigTitle").childNodes[0].textContent = L.categories;
  document.getElementById("bigSub").textContent = getLang()==='zh'?"按仓库和地区浏览现货":"Browse stock by warehouse and region";
  document.getElementById("featuredTitle").childNodes[0].textContent = L.featured;
  document.getElementById("featuredSub").textContent = getLang()==='zh'?"最近上架的现货":"Recently listed stock";
  document.getElementById("allTitle").childNodes[0].textContent = L.allProducts;
  document.getElementById("allSub").innerHTML = (getLang()==='zh'?"共 ":"Total ") + `<span id="totalCount">${products.length}</span>` + (getLang()==='zh'?" 件现货":" items");
  document.getElementById("btnUsa").textContent = L.usa;
  document.getElementById("btnUsaSub").textContent = getLang()==='zh'?"US Overseas Warehouse":"美国海外仓现货";
  document.getElementById("btnFba").textContent = L.fba;
  document.getElementById("btnFbaSub").textContent = getLang()==='zh'?"FBA Removal Stock":"FBA包邮移除现货";
  document.getElementById("btnCa").textContent = L.canada;
  document.getElementById("btnDe").textContent = L.germany;
  document.getElementById("btnUk").textContent = L.uk;
  document.getElementById("btnOther").textContent = L.other;
  document.getElementById("fcWechat").textContent = L.wechat;
  document.getElementById("fcPhone").textContent = L.phone;
  document.getElementById("footer").textContent = L.siteName + " · " + L.wechat + " · " + L.phone;
  document.title = L.siteName;
}
applyLang();

// 轮播
const latest = products.slice(-10).reverse();
const pages = [];
for (let i = 0; i < latest.length; i += 4) pages.push(latest.slice(i, i + 4));
while (pages.length < 5) pages.push([]);
const track = document.getElementById("track");
const dotsEl = document.getElementById("dots");
let cur = 0;

function renderSlides() {
  track.innerHTML = pages.map(page => `
    <div class="slide">
      ${page.map(p => `
        <div class="p-card" onclick="location.href='detail.html?id=${p.id}'">
          <img src="${p.images[0]}" alt="${getLang()==='zh'?p.name:p.nameEn}">
          <div class="name">${getLang()==='zh'?p.name:p.nameEn}</div>
          <div class="price">${formatPrice(p.price)}</div>
        </div>`).join("")}
    </div>`).join("");
  dotsEl.innerHTML = pages.map((_, i) => `<span class="dot ${i===cur?'active':''}" data-i="${i}"></span>`).join("");
  dotsEl.querySelectorAll(".dot").forEach(d => d.onclick = () => go(+d.dataset.i));
  go(cur);
}
function go(i) {
  cur = Math.max(0, Math.min(i, pages.length - 1));
  track.style.transform = `translateX(-${cur * 100}%)`;
  dotsEl.querySelectorAll(".dot").forEach((d, idx) => d.classList.toggle("active", idx === cur));
}
renderSlides();
setInterval(() => go((cur + 1) % pages.length), 4500);

// 首页产品网格
function renderHomeGrid() {
  document.getElementById("homeGrid").innerHTML = products.map(p => `
    <div class="h-card" onclick="location.href='detail.html?id=${p.id}'">
      <img src="${p.images[0]}" alt="${getLang()==='zh'?p.name:p.nameEn}" loading="lazy">
      <div class="body">
        <div class="name">${getLang()==='zh'?p.name:p.nameEn}</div>
        <div class="price">${formatPrice(p.price)}</div>
        <div class="meta">
          ${p.state ? `<span class="state">${p.state}</span>` : ""}
          <span>${t("quantity")}：${p.quantity}</span>
        </div>
      </div>
    </div>`).join("");
}
renderHomeGrid();

const fc = document.getElementById("floatContact");
document.getElementById("fcToggle").onclick = () => fc.classList.toggle("open");
</script>
</body>
</html>
