<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品展示 - 按国家</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #222; padding: 32px 24px; }
  h1 { font-size: 24px; margin-bottom: 6px; }
  .sub { color: #777; font-size: 14px; margin-bottom: 28px; }
  .countries { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
  .country-card { display: block; background: #fff; border-radius: 14px; overflow: hidden; text-decoration: none; color: inherit; box-shadow: 0 2px 8px rgba(0,0,0,.07); transition: transform .15s, box-shadow .15s; }
  .country-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,.12); }
  .country-card img { width: 100%; height: 150px; object-fit: cover; background: #eee; }
  .country-card .body { padding: 16px 18px; }
  .country-card .name { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .country-card .desc { font-size: 13px; color: #777; }
</style>
</head>
<body>

<h1>商品展示</h1>
<p class="sub">选择国家，查看该国商品</p>

<div class="countries">
  <a class="country-card" href="country.html?country=美国">
    <img src="https://picsum.photos/seed/usa/600/300" alt="美国">
    <div class="body"><div class="name">美国</div><div class="desc">服饰 · 饰品 · 家具 · 宠物用品</div></div>
  </a>
  <a class="country-card" href="country.html?country=德国">
    <img src="https://picsum.photos/seed/germany/600/300" alt="德国">
    <div class="body"><div class="name">德国</div><div class="desc">服饰 · 饰品 · 家具 · 宠物用品</div></div>
  </a>
  <a class="country-card" href="country.html?country=英国">
    <img src="https://picsum.photos/seed/uk/600/300" alt="英国">
    <div class="body"><div class="name">英国</div><div class="desc">服饰 · 饰品 · 家具 · 宠物用品</div></div>
  </a>
  <a class="country-card" href="country.html?country=法国">
    <img src="https://picsum.photos/seed/france/600/300" alt="法国">
    <div class="body"><div class="name">法国</div><div class="desc">服饰 · 饰品 · 家具 · 宠物用品</div></div>
  </a>
</div>

</body>
</html>
