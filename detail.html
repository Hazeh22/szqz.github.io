<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品详情</title>
<style>
  :root { --brand:#ff5a1f; --brand2:#ffb020; --ink:#1f2328; --muted:#6b7280; --bg:#fff8f3; --radius:16px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); }
  a { text-decoration: none; color: inherit; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 18px; }
  header { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.94); border-bottom: 1px solid #ffe3d3; }
  .header-in { display: flex; align-items: center; justify-content: space-between; height: 58px; }
  .back { font-size: 14px; color: var(--brand); font-weight: 600; }
  .lang-btn { border: 1px solid #ffd2bd; background:#fff; color: var(--brand); padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; }

  .detail { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; padding: 26px 0 40px; }
  @media (max-width: 720px) { .detail { grid-template-columns: 1fr; gap: 16px; } }

  .gallery { position: relative; border-radius: var(--radius); overflow: hidden; background: #fff; box-shadow: 0 4px 18px rgba(255,90,31,.1); }
  .g-track { display: flex; transition: transform .35s ease; }
  .g-track img { min-width: 100%; width: 100%; height: 420px; object-fit: cover; display: block; background: #f3f4f6; }
  @media (max-width: 720px) { .g-track img { height: 300px; } }
  .g-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(255,255,255,.9); font-size: 18px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .g-prev { left: 10px; } .g-next { right: 10px; }
  .g-dots { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
  .g-dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.6); cursor: pointer; }
  .g-dots span.active { background: #fff; width: 18px; border-radius: 4px; }

  .info h1 { font-size: clamp(20px, 3.5vw, 28px); font-weight: 800; margin-bottom: 12px; line-height: 1.35; }
  .price { color: var(--brand); font-size: 30px; font-weight: 800; margin-bottom: 16px; }
  .meta-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .badge { background: #fff1ea; color: #b8430f; border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600; }
  .block { background: #fff; border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(255,90,31,.06); }
  .block h3 { font-size: 15px; margin-bottom: 8px; color: var(--brand); }
  .block p { font-size: 14px; color: #374151; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }

  .tip { background: linear-gradient(135deg, #fff3e8, #ffe8d6); border: 1px solid #ffd2bd; border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
  .tip h3 { color: var(--brand); font-size: 15px; margin-bottom: 8px; }
  .tip p { font-size: 12px; color: #7a3a1a; line-height: 1.7; word-break: break-all; }

  .share-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .btn { border: none; cursor: pointer; border-radius: 999px; padding: 11px 18px; font-size: 14px; font-weight: 700; }
  .btn-primary { background: linear-gradient(135deg,#ff5a1f,#ffb020); color: #fff; }
  .btn-ghost { background: #fff; border: 1px solid #ffd2bd; color: var(--brand); }
  .contact-line { font-size: 13px; color: var(--muted); margin-top: 8px; }

  .float-contact { position: fixed; right: 16px; bottom: 18px; z-index: 90; display: flex; flex-direction: column; gap: 10px; }
  .float-contact a, .float-contact button { display: flex; align-items: center; gap: 8px; border: none; cursor: pointer; background: #fff; border-radius: 999px; padding: 10px 14px; font-size: 13px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.15); color: var(--ink); }
  .float-contact .wx { background: #07c160; color: #fff; }
  .float-contact .tel { background: var(--brand); color: #fff; }
  .float-contact .toggle { width: 48px; height: 48px; justify-content: center; padding: 0; border-radius: 50%; background: linear-gradient(135deg,#ff5a1f,#ffb020); color: #fff; font-size: 20px; }
  .float-contact .items { display: none; flex-direction: column; gap: 10px; }
  .float-contact.open .items { display: flex; }
</style>
</head>
<body>

<header>
  <div class="wrap header-in">
    <a class="back" href="javascript:history.back()" id="backBtn">← 返回</a>
    <button class="lang-btn" id="langBtn">EN</button>
  </div>
</header>

<main class="wrap">
  <div class="detail">
    <div class="gallery">
      <div class="g-track" id="gTrack"></div>
      <button class="g-nav g-prev" id="gPrev">‹</button>
      <button class="g-nav g-next" id="gNext">›</button>
      <div class="g-dots" id="gDots"></div>
    </div>

    <div class="info">
      <h1 id="pName">产品名称</h1>
      <div class="price" id="pPrice"></div>
      <div class="meta-row">
        <span class="badge" id="pCat"></span>
        <span class="badge" id="pQty"></span>
      </div>

      <div class="block">
        <h3 id="hInfo">商品信息</h3>
        <p id="pInfo"></p>
      </div>

      <div class="block">
        <h3 id="hDetail">商品描述</h3>
        <p id="pDetail"></p>
      </div>

      <div class="tip">
        <h3 id="hTip">温馨提示</h3>
        <p id="pTip">88888888888888888888888888888888888888888888888888888888888888888888</p>
      </div>

      <div class="share-row">
        <button class="btn btn-primary" id="shareBtn">分享此产品</button>
        <button class="btn btn-ghost" id="copyBtn">复制链接</button>
      </div>
      <div class="contact-line" id="contactLine">咨询联系：微信 2222222222 · 电话 3333333333</div>
    </div>
  </div>
</main>

<div class="float-contact" id="floatContact">
  <div class="items">
    <a class="wx" href="weixin://">💬 <span id="fcWechat">微信：2222222222</span></a>
    <a class="tel" href="tel:3333333333">📞 <span id="fcPhone">电话：3333333333</span></a>
  </div>
  <button class="toggle" id="fcToggle">💬</button>
</div>

<script src="data.js"></script>
<script>
const products = getProducts();
const id = getParam("id");
const p = products.find(x => x.id === id) || products[0];
renderLangBtn(document.getElementById("langBtn"));

let idx = 0;
const imgs = p ? p.images : [];

function renderGallery() {
  const track = document.getElementById("gTrack");
  const dots = document.getElementById("gDots");
  track.innerHTML = imgs.map(src => `<img src="${src}" alt="">`).join("");
  dots.innerHTML = imgs.map((_, i) => `<span class="${i===idx?'active':''}" data-i="${i}"></span>`).join("");
  dots.querySelectorAll("span").forEach(s => s.onclick = () => { idx = +s.dataset.i; updateGallery(); });
  updateGallery();
}
function updateGallery() {
  document.getElementById("gTrack").style.transform = `translateX(-${idx * 100}%)`;
  document.querySelectorAll("#gDots span").forEach((s, i) => s.classList.toggle("active", i === idx));
}
document.getElementById("gPrev").onclick = () => { idx = (idx - 1 + imgs.length) % imgs.length; updateGallery(); };
document.getElementById("gNext").onclick = () => { idx = (idx + 1) % imgs.length; updateGallery(); };

function applyLang() {
  const L = I18N[getLang()];
  document.getElementById("backBtn").textContent = "← " + L.back;
  document.getElementById("hInfo").textContent = L.productInfo;
  document.getElementById("hDetail").textContent = L.productDetail;
  document.getElementById("hTip").textContent = L.tipTitle;
  document.getElementById("pTip").textContent = L.tip;
  document.getElementById("shareBtn").textContent = L.share;
  document.getElementById("copyBtn").textContent = L.copyLink;
  document.getElementById("contactLine").textContent = L.contact + "：" + L.wechat + " · " + L.phone;
  document.getElementById("fcWechat").textContent = L.wechat;
  document.getElementById("fcPhone").textContent = L.phone;

  if (!p) return;
  document.getElementById("pName").textContent = getLang() === "zh" ? p.name : p.nameEn;
  document.getElementById("pPrice").textContent = formatPrice(p.price);
  document.getElementById("pCat").textContent = categoryLabel(p.category);
  document.getElementById("pQty").textContent = L.quantity + "：" + p.quantity;
  document.getElementById("pInfo").textContent = getLang() === "zh" ? p.info : (p.infoEn || p.info);
  document.getElementById("pDetail").textContent = getLang() === "zh" ? p.detail : (p.detailEn || p.detail);
  document.title = document.getElementById("pName").textContent;
  renderGallery();
}
applyLang();

// 分享
document.getElementById("shareBtn").onclick = async () => {
  const data = { title: document.title, text: document.title, url: location.href };
  if (navigator.share) { try { await navigator.share(data); } catch (e) {} }
  else { copyLink(); }
};
document.getElementById("copyBtn").onclick = copyLink;
function copyLink() {
  navigator.clipboard.writeText(location.href).then(() => {
    alert(t("copied"));
  }).catch(() => {
    prompt(t("copyLink"), location.href);
  });
}

const fc = document.getElementById("floatContact");
document.getElementById("fcToggle").onclick = () => fc.classList.toggle("open");
</script>
</body>
</html>
